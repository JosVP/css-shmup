<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shmup</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: #000;
      }

      body {
        background: #000;
      }

      #go-to-start-screen,
      #go-to-select,
      #start-level,
      label.debug {
        display: none;
      }

      #loading-screen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 99999;
        background: #000;
        color: #fff;
        font-family: 'Press Start 2P', 'Courier New', monospace;
        letter-spacing: 0.08em;
        text-shadow: 2px 2px 0 #000;
        opacity: 1;
        visibility: visible;
      }

      #loading-screen .preloading-screen-inner {
        position: relative;
        width: min(90vw, 780px);
        height: 180px;
      }

      #loading-screen .preload-title,
      #loading-screen .preload-loading {
        position: absolute;
        left: 0;
        width: 100%;
        margin: 0;
        font-family: 'Press Start 2P', 'Courier New', monospace;
        letter-spacing: 0.08em;
        text-align: center;
        line-height: 1.7;
        color: #fff;
      }

      #loading-screen .preload-title {
        top: 20px;
        font-size: clamp(1rem, 1.8vw, 2.1rem);
      }

      #loading-screen .preload-loading {
        top: 92px;
        font-size: clamp(0.6rem, 1vw, 0.9rem);
      }
    </style>
    <link rel="preload" href="https://i.imgur.com/UC74sSh.png" as="image" />
    <link rel="preload" href="https://i.imgur.com/y78wOY1.png" as="image" />
    <link rel="preload" href="https://i.imgur.com/Se2DXoT.png" as="image" />
    <link rel="preload" href="./audio/music.mp3" as="audio" type="audio/mpeg" />
